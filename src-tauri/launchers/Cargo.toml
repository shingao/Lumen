[package]
name = "launchers"
version = "0.1.0"
description = "Lumen — détection des jeux installés (Steam, Epic, GOG, Battle.net, EA app, Ubisoft Connect), en lecture seule et tolérante"
edition = "2021"
rust-version = "1.80"
publish = false

[dependencies]
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
disallowed_methods = "deny"
