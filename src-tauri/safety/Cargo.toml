[package]
name = "safety"
version = "0.1.0"
description = "Lumen — garde-fou unique de toute suppression, de tout déplacement et de toute commande"
edition = "2021"
rust-version = "1.80"
publish = false

[dependencies]
thiserror = "2"
blake3 = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
] }

[target.'cfg(windows)'.dev-dependencies]
junction = "1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
disallowed_methods = "deny"
