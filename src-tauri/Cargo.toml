[package]
name = "lumen"
version = "0.1.0"
description = "Lumen — comprendre et libérer l'espace disque"
edition = "2021"
rust-version = "1.80"

[workspace]
members = [".", "safety", "scan", "rules"]

[lib]
name = "lumen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
scan = { path = "scan" }
rules = { path = "rules" }
safety = { path = "safety" }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
disallowed_methods = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
