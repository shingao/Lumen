[package]
name = "lumen"
version = "0.9.0"
description = "Lumen — comprendre et libérer l'espace disque"
edition = "2021"
rust-version = "1.80"
publish = false

[workspace]
members = [".", "safety", "scan", "rules", "launchers"]

[lib]
name = "lumen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
scan = { path = "scan" }
rules = { path = "rules" }
safety = { path = "safety" }
launchers = { path = "launchers" }
rusqlite = { version = "0.40", features = ["bundled"] }
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode", "std"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
tauri-winrt-notification = "0.8"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
disallowed_methods = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
