name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # safety/ d'abord : si un de ses tests échoue, est ignoré ou manque, rien d'autre ne tourne
  # et aucun installeur n'est produit.
  safety:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Les fixtures 8.3 ont besoin de noms courts sur le volume du dossier temporaire.
      - name: "Noms courts 8.3 actifs sur C:"
        run: |
          fsutil 8dot3name set C: 0
          fsutil 8dot3name query C:
          echo "TEMP=$env:TEMP"
      - name: Tests de safety/ (jonctions, symlinks, 8.3, verrous, SYSTEM, Corbeille…)
        run: node scripts/check-safety-tests.mjs

  # La partie pure de safety/ doit aussi passer hors de Windows.
  safety-portable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-safety-tests.mjs

  front:
    needs: [safety, safety-portable]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck, lint, tests (dont contrastes AA des deux thèmes)
        run: npm run check
      # Bloquant : ce qui est embarqué dans l'appli.
      - name: npm audit (dépendances livrées)
        run: npm audit --omit=dev --audit-level=high
      # Informatif : outillage de dev (ex. braces via stylelint, sans correctif publié).
      - name: npm audit (outillage de dev, informatif)
        continue-on-error: true
        run: npm audit --audit-level=high

  rust:
    needs: [safety, safety-portable]
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # generate_context! a besoin du front construit.
      - run: npm ci && npm run build
      - name: Clippy (unwrap, panic et suppressions hors safety/ interdits)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests Rust
        working-directory: src-tauri
        run: cargo test --workspace
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

  build:
    needs: [safety, front, rust]
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      LUMEN_SIGN_CERT: ${{ secrets.LUMEN_SIGN_CERT }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installeur NSIS
        run: npx tauri build
      # Signature Authenticode : placeholder. Ajouter les secrets LUMEN_SIGN_CERT (PFX en base64)
      # et LUMEN_SIGN_PASSWORD pour l'activer ; sans eux, l'étape est sautée.
      - name: Signature (si certificat configuré)
        if: ${{ env.LUMEN_SIGN_CERT != '' }}
        env:
          LUMEN_SIGN_PASSWORD: ${{ secrets.LUMEN_SIGN_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "lumen.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:LUMEN_SIGN_CERT))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe, src-tauri/target/release/lumen.exe | ForEach-Object {
            & $signtool.FullName sign /f $pfx /p $env:LUMEN_SIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
          }
          Remove-Item $pfx
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
