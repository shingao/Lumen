name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Jalon 2 : un job « safety » (cargo test safety) passera en premier et bloquera tout le reste.

  front:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck, lint, tests (dont contrastes AA des deux thèmes)
        run: npm run check
      - name: npm audit
        run: npm audit --audit-level=high

  rust:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # generate_context! a besoin du front construit.
      - run: npm ci && npm run build
      - name: Clippy (unwrap, panic et suppressions hors safety/ interdits)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests Rust
        working-directory: src-tauri
        run: cargo test
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

  build:
    needs: [front, rust]
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      LUMEN_SIGN_CERT: ${{ secrets.LUMEN_SIGN_CERT }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installeur NSIS
        run: npx tauri build
      # Signature Authenticode : placeholder. Ajouter les secrets LUMEN_SIGN_CERT (PFX en base64)
      # et LUMEN_SIGN_PASSWORD pour l'activer ; sans eux, l'étape est sautée.
      - name: Signature (si certificat configuré)
        if: ${{ env.LUMEN_SIGN_CERT != '' }}
        env:
          LUMEN_SIGN_PASSWORD: ${{ secrets.LUMEN_SIGN_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "lumen.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:LUMEN_SIGN_CERT))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe, src-tauri/target/release/lumen.exe | ForEach-Object {
            & $signtool.FullName sign /f $pfx /p $env:LUMEN_SIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
          }
          Remove-Item $pfx
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
